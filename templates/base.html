{% load versioned_static %}
<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RF4 Assistant — неофициальный справочник водоёмов Russian Fishing 4.">
  <title>{% block title %}RF4 Assistant{% endblock %}</title>
  <script src="{% versioned_static 'js/theme.js' %}"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% versioned_static 'css/site.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  {% include 'includes/navbar.html' %}
  <main id="main-content" class="container py-4 py-lg-5 flex-grow-1">
    {% block content %}{% endblock %}
  </main>
  {% include 'includes/footer.html' %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
