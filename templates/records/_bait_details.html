<template data-bait-fish-summary>
  {% for fish in row.fish_details %}
  <tr>
    <th scope="row" class="records-panel-bait fw-normal">
      <button type="button" class="records-bait-trigger gap-2" data-bait-fish-index="{{ forloop.counter0 }}"
              data-bait-fish-key="{{ fish.key }}">
        {% if fish.image_url %}<img src="{{ fish.image_url }}" class="records-bait-icon" alt="" loading="lazy" width="24" height="24">{% endif %}
        <span data-bait-fish-name>{{ fish.fish }}</span>
      </button>
      <template data-bait-fish-catches>
        {% for catch in fish.catches %}
        <tr data-caught-date="{{ catch.date }}">
          <td class="text-nowrap">{{ catch.date_display }}</td>
          <td class="text-break">
            <span class="d-flex align-items-center gap-2">
              {% if fish.image_url %}<img src="{{ fish.image_url }}" class="records-bait-icon flex-shrink-0" alt="" loading="lazy" width="24" height="24">{% endif %}
              <span>{{ fish.fish }}</span>
            </span>
          </td>
          <td class="text-end text-nowrap">{% include 'records/_weight.html' with trophy=catch.trophy weight=catch.weight_display only %}</td>
          <td class="text-end"><span class="d-block text-truncate" title="{{ catch.player }}">{{ catch.player }}</span></td>
        </tr>
        {% endfor %}
      </template>
    </th>
    <td class="text-end">{{ fish.count }}</td>
    <td class="text-end text-nowrap">{{ fish.average_weight_display }}</td>
    <td class="text-end text-nowrap">{% include 'records/_weight.html' with trophy=fish.max_weight_trophy weight=fish.weight_display only %}</td>
  </tr>
  {% endfor %}
</template>
