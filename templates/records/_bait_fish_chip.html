<button type="button" class="records-bait-item records-bait-trigger"
        title="{{ fish.fish }} — {{ fish.count }}" data-bait-fish-index="{{ forloop.counter0 }}"
        data-bs-toggle="offcanvas" data-bs-target="#bait-records-panel" aria-controls="bait-records-panel">
  {% if fish.image_url %}<img src="{{ fish.image_url }}" class="records-bait-icon" alt="" loading="lazy" width="24" height="24">{% endif %}
  <span>{{ fish.fish }}</span><strong class="records-bait-count">{{ fish.count }}</strong>
</button>
