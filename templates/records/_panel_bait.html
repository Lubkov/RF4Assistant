<button type="button" class="records-panel-bait-line records-bait-trigger d-flex align-items-center gap-1"
        data-record-bait="{{ bait.name }}">
  {% if bait.image_url %}
  <img class="records-bait-icon flex-shrink-0" src="{{ bait.image_url }}" alt="" loading="lazy" width="24" height="24">
  {% endif %}
  <span class="text-truncate" data-record-truncate>{{ bait.name }}</span>
</button>
